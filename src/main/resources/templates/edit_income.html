<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
  <div class="app-layout" data-page="income" th:with="activePage='income', pageTitle='Edit Income Record', pageSubtitle='Update the details for inflow #' + ${data.incomeId}">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
      <header th:replace="~{fragments/layout :: topbar}"></header>

      <div class="page-container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
          <div class="card-header">
            <h2><i class="fas fa-edit"></i> Modify Inflow Details</h2>
            <a href="/income" class="btn btn-outline btn-sm">
              <i class="fas fa-arrow-left"></i> Back to Income
            </a>
          </div>

          <form method="POST" th:action="@{'/edit_income/' + ${data.incomeId}}">
            <div class="form-group">
              <label class="form-label">Amount (₹)</label>
              <input type="number" step="0.01" min="0.01" name="amount" class="form-control" 
                     th:value="${data.amount}" required>
            </div>

            <div class="form-group">
              <label class="form-label">Date Received</label>
              <input type="date" name="date" class="form-control" 
                     th:value="${data.incomeDate}" required>
            </div>

            <div class="form-group">
              <label class="form-label">Source / Description</label>
              <input type="text" name="description" class="form-control" 
                     th:value="${data.description}" placeholder="Description" required>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
              <a href="/income" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
              <button type="submit" class="btn btn-emerald" style="flex: 2;">
                <i class="fas fa-check"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: quickAddModals}"></div>
  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

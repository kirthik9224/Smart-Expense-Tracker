<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
  <div class="app-layout" data-page="expense" th:with="activePage='expense', pageTitle='Edit Expense Record', pageSubtitle='Update the details for transaction #' + ${data.expenseId}">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
      <header th:replace="~{fragments/layout :: topbar}"></header>

      <div class="page-container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
          <div class="card-header">
            <h2><i class="fas fa-edit"></i> Modify Transaction Details</h2>
            <a href="/expense" class="btn btn-outline btn-sm">
              <i class="fas fa-arrow-left"></i> Back to Expenses
            </a>
          </div>

          <form method="POST" th:action="@{'/edit_expense/' + ${data.expenseId}}">
            <div class="form-group">
              <label class="form-label">Amount (₹)</label>
              <input type="number" step="0.01" min="0.01" name="amount" class="form-control" 
                     th:value="${data.amount}" required>
            </div>

            <div class="form-group">
              <label class="form-label">Category</label>
              <select name="category" class="form-control" required>
                <option value="Food & Groceries" th:selected="${data.category == 'Food & Groceries' || data.category == 'Food'}">🍔 Food & Groceries</option>
                <option value="Transport & Travel" th:selected="${data.category == 'Transport & Travel' || data.category == 'Travel'}">🚗 Transport & Travel</option>
                <option value="Rent & Housing" th:selected="${data.category == 'Rent & Housing' || data.category == 'Rent'}">🏠 Rent & Housing</option>
                <option value="Bills & Utilities" th:selected="${data.category == 'Bills & Utilities'}">💡 Bills & Utilities</option>
                <option value="Healthcare & Medical" th:selected="${data.category == 'Healthcare & Medical'}">🩺 Healthcare & Medical</option>
                <option value="Education & Kids" th:selected="${data.category == 'Education & Kids'}">🎓 Education & Kids</option>
                <option value="Entertainment" th:selected="${data.category == 'Entertainment'}">🎬 Entertainment</option>
                <option value="Shopping & Personal" th:selected="${data.category == 'Shopping & Personal'}">🛍️ Shopping & Personal</option>
                <option value="Others" th:selected="${data.category == 'Others'}">📦 Others</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Expense Date</label>
              <input type="date" name="date" class="form-control" 
                     th:value="${data.expenseDate}" required>
            </div>

            <div class="form-group">
              <label class="form-label">Description / Note</label>
              <input type="text" name="description" class="form-control" 
                     th:value="${data.description}" placeholder="Description">
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
              <a href="/expense" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
              <button type="submit" class="btn btn-primary" style="flex: 2;">
                <i class="fas fa-check"></i> Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: quickAddModals}"></div>
  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

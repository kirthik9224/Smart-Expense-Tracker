<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Smart Expense Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.45) 0%, transparent 45%), radial-gradient(circle at 85% 85%, rgba(99, 102, 241, 0.40) 0%, transparent 45%), radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.25) 0%, transparent 55%), #0B0F19;">
  <div class="card" style="max-width: 440px; width: 100%; padding: 36px; border-radius: var(--radius-xl); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); background: rgba(21, 28, 44, 0.90); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); color: #F8FAFC;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #10B981, #0EA5E9); display: inline-flex; align-items: center; justify-content: center; color: white; font-size: 22px; margin-bottom: 14px; box-shadow: 0 8px 16px rgba(16,185,129,0.3);">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 700; color: var(--text-main);">Create Account</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Start taking control of your family finances</p>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert-banner danger" style="padding: 12px 14px; margin-bottom: 20px; font-size: 13px;">
      <i class="fas fa-triangle-exclamation"></i>
      <span th:text="${error}">Registration error</span>
    </div>

    <form method="POST" action="/register" onsubmit="return validatePasswords()">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div style="position: relative;">
          <input type="text" name="name" class="form-control" placeholder="Kirthik" style="padding-left: 38px;" required autofocus>
          <i class="fas fa-user" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 14px;"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" name="email" class="form-control" placeholder="name@example.com" style="padding-left: 38px;" required>
          <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 14px;"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" name="password" id="regPassword" class="form-control" placeholder="••••••••" style="padding-left: 38px;" required minlength="6">
          <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 14px;"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position: relative;">
          <input type="password" name="confirmPassword" id="regConfirmPassword" class="form-control" placeholder="••••••••" style="padding-left: 38px;" required minlength="6">
          <i class="fas fa-shield-check" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 14px;"></i>
        </div>
        <div id="passwordMismatchMsg" style="display: none; color: var(--rose-500); font-size: 12px; margin-top: 4px;">
          Passwords do not match.
        </div>
      </div>

      <button type="submit" class="btn btn-emerald" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 14px;">
        <i class="fas fa-circle-check"></i> Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 13px; color: var(--text-muted);">
      Already have an account? 
      <a href="/login" style="font-weight: 600; color: var(--primary-500);">Sign In here</a>
    </div>

    <div style="text-align: center; margin-top: 12px;">
      <a href="/" style="font-size: 12px; color: var(--text-muted);">
        <i class="fas fa-arrow-left"></i> Back to Homepage
      </a>
    </div>
  </div>

  <script>
    function validatePasswords() {
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('regConfirmPassword').value;
      const msg = document.getElementById('passwordMismatchMsg');
      if (p1 !== p2) {
        msg.style.display = 'block';
        return false;
      }
      msg.style.display = 'none';
      return true;
    }
  </script>
</body>
</html>

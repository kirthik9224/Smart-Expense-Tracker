<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle != null ? pageTitle + ' | Smart Expense Tracker' : 'Smart Expense Tracker'}">Smart Expense Tracker</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Main Design System CSS -->
  <link rel="stylesheet" th:href="@{/css/app.css}">
  
  <!-- Inline Theme Initializer -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>

  <!-- ================= REUSABLE SIDEBAR ================= -->
  <aside th:fragment="sidebar" class="app-sidebar" id="appSidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="fas fa-wallet"></i>
      </div>
      <div>
        <div class="brand-title">SmartTracker</div>
        <div class="brand-subtitle">Family Finance</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Menu</div>
      <a href="/dashboard" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active'">
        <i class="fas fa-chart-line"></i>
        <span>Dashboard</span>
      </a>
      <a href="/income" class="nav-item" th:classappend="${activePage == 'income'} ? 'active'">
        <i class="fas fa-hand-holding-usd"></i>
        <span>Income & Savings</span>
      </a>
      <a href="/expense" class="nav-item" th:classappend="${activePage == 'expense'} ? 'active'">
        <i class="fas fa-receipt"></i>
        <span>Expenses</span>
      </a>
      <a href="/expense_evaluation" class="nav-item" th:classappend="${activePage == 'evaluation'} ? 'active'">
        <i class="fas fa-chart-pie"></i>
        <span>Analytics</span>
      </a>
      <a href="/budget" class="nav-item" th:classappend="${activePage == 'budget'} ? 'active'">
        <i class="fas fa-shield-alt"></i>
        <span>Budget & Health</span>
      </a>

      <div class="nav-section-title" style="margin-top: 14px;">Account</div>
      <a href="/settings" class="nav-item" th:classappend="${activePage == 'settings'} ? 'active'">
        <i class="fas fa-sliders-h"></i>
        <span>Settings</span>
      </a>
      <a href="/logout" class="nav-item" style="color: var(--rose-500);">
        <i class="fas fa-sign-out-alt"></i>
        <span>Logout</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="user-avatar" th:text="${#strings.substring(session.user_name != null ? session.user_name : 'User', 0, 1)}">
          U
        </div>
        <div class="user-info">
          <div class="user-name" th:text="${session.user_name != null ? session.user_name : 'User'}">Logged In User</div>
          <div class="user-role">Primary Account</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ================= REUSABLE TOPBAR ================= -->
  <header th:fragment="topbar" class="app-topbar">
    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="topbar-title">
        <h1 th:text="${pageTitle != null ? pageTitle : 'Smart Tracker'}">Overview</h1>
        <p th:text="${pageSubtitle != null ? pageSubtitle : 'Real-time family budget & expense tracker'}">Real-time family budget & expense tracker</p>
      </div>
    </div>

    <div class="topbar-actions">
      <!-- Quick Add Expense Trigger -->
      <button class="btn btn-primary btn-sm" onclick="openModal('quickExpenseModal')">
        <i class="fas fa-plus"></i>
        <span>Add Expense</span>
      </button>
      <!-- Quick Add Income Trigger -->
      <button class="btn btn-emerald btn-sm" onclick="openModal('quickIncomeModal')">
        <i class="fas fa-arrow-down"></i>
        <span>Add Income</span>
      </button>

      <!-- Theme Switcher -->
      <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <!-- ================= QUICK ADD MODALS ================= -->
  <div th:fragment="quickAddModals">
    <!-- Quick Expense Modal -->
    <div class="modal-overlay" id="quickExpenseModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 style="font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-receipt" style="color: var(--rose-500);"></i>
            <span>Record New Expense</span>
          </h3>
          <button class="modal-close-btn" onclick="closeModal('quickExpenseModal')">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form method="POST" action="/expense" id="quickExpenseForm">
          <div class="form-group">
            <label class="form-label">Expense Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" name="amount" id="quickExpAmount" class="form-control" placeholder="0.00" required>
            <div class="quick-amounts">
              <span class="btn-preset" onclick="addAmount('quickExpAmount', 100)">+₹100</span>
              <span class="btn-preset" onclick="addAmount('quickExpAmount', 500)">+₹500</span>
              <span class="btn-preset" onclick="addAmount('quickExpAmount', 1000)">+₹1,000</span>
              <span class="btn-preset" onclick="addAmount('quickExpAmount', 5000)">+₹5,000</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" class="form-control" required>
              <option value="Food & Groceries">🍔 Food & Groceries</option>
              <option value="Transport & Travel">🚗 Transport & Travel</option>
              <option value="Rent & Housing">🏠 Rent & Housing</option>
              <option value="Bills & Utilities">💡 Bills & Utilities</option>
              <option value="Healthcare & Medical">🩺 Healthcare & Medical</option>
              <option value="Education & Kids">🎓 Education & Kids</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="Shopping & Personal">🛍️ Shopping & Personal</option>
              <option value="Others">📦 Others</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control auto-today-date" required>
          </div>
          <div class="form-group">
            <label class="form-label">Description (Optional)</label>
            <input type="text" name="description" class="form-control" placeholder="E.g. Weekly grocery run at DMart">
          </div>
          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeModal('quickExpenseModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" style="flex: 2;">Save Expense</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Quick Income Modal -->
    <div class="modal-overlay" id="quickIncomeModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3 style="font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-hand-holding-usd" style="color: var(--emerald-500);"></i>
            <span>Record Income</span>
          </h3>
          <button class="modal-close-btn" onclick="closeModal('quickIncomeModal')">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <form method="POST" action="/income" id="quickIncomeForm">
          <div class="form-group">
            <label class="form-label">Income Amount (₹)</label>
            <input type="number" step="0.01" min="0.01" name="amount" id="quickIncAmount" class="form-control" placeholder="0.00" required>
            <div class="quick-amounts">
              <span class="btn-preset" onclick="addAmount('quickIncAmount', 5000)">+₹5,000</span>
              <span class="btn-preset" onclick="addAmount('quickIncAmount', 10000)">+₹10,000</span>
              <span class="btn-preset" onclick="addAmount('quickIncAmount', 50000)">+₹50,000</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="form-control auto-today-date" required>
          </div>
          <div class="form-group">
            <label class="form-label">Source / Description</label>
            <input type="text" name="description" class="form-control" placeholder="E.g. Monthly Salary, Freelance, Dividend" required>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeModal('quickIncomeModal')">Cancel</button>
            <button type="submit" class="btn btn-emerald" style="flex: 2;">Save Income</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= REUSABLE SCRIPTS ================= -->
  <div th:fragment="scripts">
    <script>
      function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeIcon(newTheme);
      }

      function updateThemeIcon(theme) {
        const icon = document.getElementById('themeIcon');
        if (icon) {
          icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
      }

      function openModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
      }

      function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
      }

      function addAmount(inputId, amount) {
        const input = document.getElementById(inputId);
        if (input) {
          const cur = parseFloat(input.value) || 0;
          input.value = (cur + amount).toFixed(2);
        }
      }

      function filterTable(inputId, tableId) {
        const query = document.getElementById(inputId).value.toLowerCase();
        const rows = document.querySelectorAll('#' + tableId + ' tbody tr');
        rows.forEach(row => {
          const text = row.innerText.toLowerCase();
          row.style.display = text.includes(query) ? '' : 'none';
        });
      }

      function confirmDelete(url, itemLabel) {
        if (confirm('Are you sure you want to permanently delete this ' + itemLabel + '? This action cannot be undone.')) {
          window.location.href = url;
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.querySelectorAll('.auto-today-date').forEach(input => {
          if (!input.value) input.value = today;
        });

        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        updateThemeIcon(currentTheme);

        document.querySelectorAll('.modal-overlay').forEach(modal => {
          modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
          });
        });
      });
    </script>
  </div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
  <div class="app-layout" data-page="settings" th:with="activePage='settings', pageTitle='Account & Security Settings', pageSubtitle='Manage your personal profile and authentication credentials'">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="app-main">
      <header th:replace="~{fragments/layout :: topbar}"></header>

      <div class="page-container">
        <!-- Flash Messages -->
        <div th:if="${message}" class="alert-banner success">
          <i class="fas fa-circle-check"></i>
          <span th:text="${message}">Success message</span>
        </div>
        <div th:if="${error}" class="alert-banner danger">
          <i class="fas fa-triangle-exclamation"></i>
          <span th:text="${error}">Error message</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px;">
          <!-- Profile Settings Panel -->
          <div class="card">
            <div class="card-header">
              <h2><i class="fas fa-user-circle"></i> Profile Information</h2>
            </div>

            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);">
              <div class="user-avatar" style="width: 56px; height: 56px; font-size: 22px;"
                   th:text="${#strings.substring(session.user_name != null ? session.user_name : 'User', 0, 1)}">
                U
              </div>
              <div>
                <h3 style="font-size: 16px; font-weight: 700;" th:text="${session.user_name != null ? session.user_name : 'Account User'}">Name</h3>
                <p style="font-size: 13px; color: var(--text-muted);" th:text="${user != null ? user.email : session.user_email}">user@example.com</p>
              </div>
            </div>

            <form method="post" action="/settings/profile">
              <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" 
                       th:value="${session.user_name}" required>
              </div>

              <div class="form-group">
                <label class="form-label">Email Address (Registered)</label>
                <input type="email" class="form-control" 
                       th:value="${user != null ? user.email : session.user_email}" disabled style="opacity: 0.7; cursor: not-allowed;">
                <small style="color: var(--text-muted); font-size: 11px; margin-top: 4px; display: block;">
                  Email is locked to primary account credentials.
                </small>
              </div>

              <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
                <i class="fas fa-save"></i> Save Profile
              </button>
            </form>
          </div>

          <!-- Password / Security Panel -->
          <div class="card">
            <div class="card-header">
              <h2><i class="fas fa-lock"></i> Security & Password</h2>
            </div>

            <form method="post" action="/settings/password">
              <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" class="form-control" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
              </div>

              <button type="submit" class="btn btn-emerald" style="margin-top: 10px;">
                <i class="fas fa-key"></i> Update Password
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: quickAddModals}"></div>
  <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
